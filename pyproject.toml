[project]
name = "admin-toolkit"
version = "0.0.0"
description = "Linux admin/DevOps toolkit — bash + Python dual-implementation tools"
requires-python = ">=3.11"
dependencies = []
 
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.4",
]
 
[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
 
[tool.mypy]
strict = true
warn_unused_ignores = true
warn_return_any = true
 
[tool.ruff]
line-length = 100
target-version = "py311"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
 
# NOTE: this is a repo-wide baseline. Individual tool subprojects under
# python/ may need their own pyproject.toml or dependency additions as they
# gain real third-party dependencies (paramiko, requests, cryptography,
# etc.) — add those at the tool level, keep this file as the shared floor
# (lint/type/test config), not a dumping ground for every tool's deps.
